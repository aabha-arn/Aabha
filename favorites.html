<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Favorites | Aabha</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    rel="stylesheet"
  >

</head>


<body>


<!-- ================= BACK BUTTON ================= -->

<button
  class="drawer-btn"
  onclick="location.href='index.html'"
  aria-label="Back"
>

  <i class="fa-solid fa-arrow-left"></i>

</button>


<!-- ================= HEADER ================= -->

<header class="site-header">

  <img
    src="aabha-logo.png"
    alt="Aabha"
    class="brand-logo"
    onclick="location.href='index.html'"
    style="cursor:pointer"
  >

  <p class="tagline">
    Your Favorite Pieces.
  </p>

</header>


<!-- ================= FAVORITES ================= -->

<div class="container">


  <div class="favorites-header">

    <h1>

      <i class="fa-solid fa-heart"></i>

      My Favorites

    </h1>

    <p>
      Products you've saved for later.
    </p>

  </div>


  <div
    class="products-grid"
    id="favorites-container"
  ></div>


</div>


<script>

const FAVORITES_KEY =
  "aabhaFavorites";


const container =
  document.getElementById(
    "favorites-container"
  );


/* =========================================================
   LOAD FAVORITES
   ========================================================= */

function getFavorites() {

  return JSON.parse(
    localStorage.getItem(
      FAVORITES_KEY
    ) || "[]"
  );

}


/* =========================================================
   REMOVE FAVORITE
   ========================================================= */

function removeFavorite(
  event,
  id
) {

  event.stopPropagation();


  let favorites =
    getFavorites();


  favorites =
    favorites.filter(
      product =>
        product.id !== id
    );


  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(
      favorites
    )
  );


  renderFavorites();

}


/* =========================================================
   OPEN PRODUCT
   ========================================================= */

function openProduct(id) {

  location.href =
    "product-details.html?id=" +
    id;

}


/* =========================================================
   RENDER FAVORITES
   ========================================================= */

function renderFavorites() {

  const favorites =
    getFavorites();


  container.innerHTML = "";


  if (
    favorites.length === 0
  ) {

    container.innerHTML = `

      <div
        class="favorites-empty"
        style="grid-column:1/-1;"
      >

        <i class="fa-regular fa-heart"></i>


        <h2>
          No Favorites Yet
        </h2>


        <p>
          Tap the heart on any product
          to save it here.
        </p>


        <button
          class="primary-btn"
          style="max-width:220px;"
          onclick="location.href='index.html'"
        >
          Explore Products
        </button>

      </div>

    `;

    return;

  }


  favorites.forEach(
    product => {

      const imageUrl =
        product.image ||
        "https://via.placeholder.com/300";


      container.innerHTML += `

        <article
          class="product-card favorite-card"
          onclick="openProduct('${product.id}')"
        >


          <div class="product-image">

            <img
              src="${imageUrl}"
              alt="${product.name}"
            >


            <button
              class="favorite-remove-btn"
              onclick="
                removeFavorite(
                  event,
                  '${product.id}'
                )
              "
              title="Remove from favorites"
            >

              <i class="fa-solid fa-heart"></i>

            </button>

          </div>


          <div class="product-info">

            <h3>
              ${product.name}
            </h3>


            <p class="desc">
              ${product.description || ""}
            </p>


            <div class="card-footer">

              <span class="price">
                ₹${product.price}
              </span>


              <button
                class="primary-btn"
              >
                View Details
              </button>

            </div>

          </div>

        </article>

      `;

    }
  );

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderFavorites();

</script>


<!-- =========================================================
     FAVORITES PAGE SPECIFIC STYLING
     ========================================================= -->

<style>

/* ================= FAVORITES TITLE HEART ================= */

.favorites-header h1 i {
  color: #59AD93;
}


/* ================= FAVORITES HEADER ================= */

.favorites-header {
  text-align: center;
  margin-bottom: 30px;
}


.favorites-header h1 {
  color: var(--text);
  font-size: 30px;
  margin-bottom: 5px;
}


.favorites-header p {
  color: var(--muted);
}


/* ================= EMPTY FAVORITES ================= */

.favorites-empty {
  text-align: center;
  padding: 80px 20px;
}


.favorites-empty i {
  font-size: 50px;
  color: var(--primary);
  margin-bottom: 20px;
}


.favorites-empty h2 {
  color: var(--text);
  margin-bottom: 8px;
}


.favorites-empty p {
  color: var(--muted);
  margin-bottom: 25px;
}


/* ================= FAVORITE CARD ================= */

.favorite-card {
  position: relative;
}


/* ================= REMOVE FAVORITE BUTTON ================= */

.favorite-remove-btn {
  position: absolute;

  top: 12px;
  right: 12px;

  width: 38px;
  height: 38px;

  border-radius: 50%;

  border: none;

  background: rgba(255, 255, 255, 0.94);

  color: var(--primary);

  cursor: pointer;

  display: grid;
  place-items: center;

  z-index: 10;

  box-shadow:
    0 4px 15px rgba(0, 0, 0, 0.12);

  transition: 0.2s ease;
}


.favorite-remove-btn:hover {

  transform: scale(1.08);

  background: var(--primary);

  color: #FFFFFF;

}


/* ================= MOBILE ================= */

@media (max-width: 480px) {

  .favorite-remove-btn {

    width: 34px;
    height: 34px;

    top: 8px;
    right: 8px;

    font-size: 15px;

  }

}

</style>


</body>

</html>
