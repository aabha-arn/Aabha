/* =========================================================

   ========================================================= */

const firebaseConfig = {

    "AIzaSyAskFF6Xn-ZfYSxd5hUZkNG-7BIhAH9Lj4",

  authDomain:
    "aabha-e46fa.firebaseapp.com",

/* =========================================================
   PRODUCT

const urlParams =
  new URLSearchParams(
    window.location.search

const productId =
  urlParams.get("id");


let currentProduct = null;


/* =========================================================
   SELECTED SIZE

let selectedSize = null;


/* =========================================================

   ========================================================= */

let reviewImageData = null;


/* =========================================================

/* =========================================================
   REVIEWER ID
   ========================================================= */

const REVIEWER_ID_KEY =
  "aabhaReviewerId";


function getReviewerId() {

  let reviewerId =
    localStorage.getItem(
      REVIEWER_ID_KEY
    );


  if (!reviewerId) {

    reviewerId =
      "reviewer_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 15);


    localStorage.setItem(
      REVIEWER_ID_KEY,
      reviewerId
    );

  }


  return reviewerId;

}


const reviewerId =
  getReviewerId();


/* =========================================================
   FAVORITES
   ========================================================= */

const FAVORITES_KEY =
  "aabhaFavorites";


function getFavorites() {

  return JSON.parse(
    localStorage.getItem(
      FAVORITES_KEY
    ) || "[]"
  );

}


function saveFavorites(
  favorites
) {

  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(
      favorites
    )
  );

}


function isFavorite() {

  const favorites =
    getFavorites();


  return favorites.some(
    product =>
      product.id === productId
  );

}


function toggleFavorite() {

  if (!currentProduct) {

    return;

  }


  let favorites =
    getFavorites();


  const existingIndex =
    favorites.findIndex(
      product =>
        product.id === productId
    );


  if (
    existingIndex !== -1
  ) {

    favorites.splice(
      existingIndex,
      1
    );

  } else {

    favorites.push({

      id: productId,

      name:
        currentProduct.name,

      price:
        currentProduct.price,

      description:
        currentProduct.description || "",

      image:
        currentProduct.images?.[0] ||
        currentProduct.image ||
        ""

    });

  }


  saveFavorites(
    favorites
  );


  updateFavoriteButton();

  initProductImageZoom();

}


/* =========================================================
   UPDATE FAVORITE BUTTON
   ========================================================= */

function updateFavoriteButton() {

  const button =
    document.getElementById(
      "detailsFavoriteBtn"
    );


  if (!button) {

    return;

  }


  const favorite =
    isFavorite();


  if (favorite) {

    button.classList.add(
      "active"
    );


    button.innerHTML = `

      <i class="fa-solid fa-heart"></i>

      Remove from Favorites

    `;

  } else {

    button.classList.remove(
      "active"
    );


    button.innerHTML = `

      <i class="fa-regular fa-heart"></i>

      Add to Favorites

    `;

  }

}


/* =========================================================
   LOAD PRODUCT
   ========================================================= */

        padding:50px;

  `;

} else {

}


/* =========================================================
   LOAD PRODUCT DATA
   ========================================================= */

function loadProductData() {

  db.collection("products")
    .doc(productId)
    .get()

    .then(doc => {

      if (!doc.exists) {

        document.getElementById(
          "product-box"
        ).innerHTML = `

          <p
            style="
              text-align:center;
              padding:50px;
            "
          >

            Product not found.

          </p>

        `;

        return;

      }


      currentProduct =
        doc.data();


      renderProduct();

      loadReviews();

    })

    .catch(err => {

      console.error(
        "Error loading product:",
        err
      );


      document.getElementById(
        "product-box"
      ).innerText =
        "Error loading details.";

    });

}


/* =========================================================
   GET PRODUCT SIZES
   ========================================================= */

function getProductSizes() {

  if (
    Array.isArray(
      currentProduct.sizes
    )
  ) {

    return currentProduct.sizes
      .map(
        size =>
          String(size).trim()
      )
      .filter(
        size =>
          size !== ""
      );

  }


  if (
    typeof currentProduct.sizes ===
    "string"
  ) {

    return currentProduct.sizes
      .split(",")
      .map(
        size =>
          size.trim()
      )
      .filter(
        size =>
          size !== ""
      );

  }


  return [

    "XXS",
    "XS",
    "S",
    "M",
    "L",
    "XL",
    "XXL",
    "XXXL"

  ];

}


/* =========================================================
   SELECT SIZE
   ========================================================= */

function selectSize(size) {

  selectedSize =
    size;


  document
    .querySelectorAll(
      ".size-option"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "selected",
          button.dataset.size === size
        );

      }
    );


  const selectedText =
    document.getElementById(
      "selectedSizeText"
    );


  if (selectedText) {

    selectedText.textContent =
      "Selected: " + size;

  }

}


/* =========================================================
   RENDER SIZE OPTIONS
   ========================================================= */

function renderSizeOptions() {

  const sizes =
    getProductSizes();


  return `

    <div class="size-section">

      <div class="size-header">

        <span class="size-title">
          Select Size
        </span>

        <span
          class="selected-size-text"
          id="selectedSizeText"
        >

          Select a size

        </span>

      </div>


      <div class="size-options">

        ${sizes
          .map(
            size => `

              <button
                type="button"
                class="size-option"
                data-size="${size}"
                onclick="selectSize('${size}')"
              >

                ${size}

              </button>

            `
          )
          .join("")}

      </div>

    </div>

  `;

}


/* =========================================================
   RENDER PRODUCT
   ========================================================= */

function renderProduct() {

  let rawImages = [];


  if (
    Array.isArray(
      currentProduct.images
    )
  ) {

    rawImages =
      [
        ...currentProduct.images
      ];

  }


  if (
    currentProduct.image
  ) {

    rawImages.push(
      currentProduct.image
    );

  }


  const uniqueImages =
    [
      ...new Set(
        rawImages
      )
    ]
    .filter(
      url =>
        url &&
        url.trim() !== ""
    );


  const finalImages =
    uniqueImages.length > 0
      ? uniqueImages
      : [
          "https://via.placeholder.com/500"
        ];


  const thumbsHtml =
    finalImages.length > 1

      ? `

        <div class="thumbs">

          ${finalImages
            .map(
              imgUrl => `

                <img
                  src="${imgUrl}"
                  onclick="
                    document.getElementById(
                      'mainImg'
                    ).src='${imgUrl}'
                  "
                  alt="thumbnail"
                >

              `
            )
            .join("")}

        </div>

      `

      : "";


  const sizeOptionsHtml =
    renderSizeOptions();


  document.getElementById(
    "product-box"
  ).innerHTML = `

    <div class="product-layout">


      <div class="image-section">

        ${thumbsHtml}


        <img
          id="mainImg"
          src="${finalImages[0]}"
          class="main-img"
          alt="${currentProduct.name}"
        >

      </div>


      <div class="details">

        <h2>
          ${currentProduct.name}
        </h2>


        <p class="desc">

          ${
            currentProduct.description ||
            "Sophisticated design crafted for style and comfort."
          }

        </p>


        <div class="price">

          ₹${currentProduct.price}

        </div>


        ${sizeOptionsHtml}


        <div class="actions">


          <button
            class="primary-btn"
            onclick="buyNow()"
          >

            <i class="fa-brands fa-whatsapp"></i>

            Buy Now

          </button>


          <button
            id="detailsFavoriteBtn"
            class="primary-btn favorite-details-btn"
            onclick="toggleFavorite()"
          >

            <i class="fa-regular fa-heart"></i>

            Add to Favorites

          </button>


        </div>

      </div>

    </div>

  `;


  updateFavoriteButton();

}

/* =========================================================
   REVIEW IMAGE HANDLER
   ========================================================= */

function handleReviewImage(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Please select an image file."
    );

    event.target.value = "";

    return;

  }


  if (
    file.size >
    10 * 1024 * 1024
  ) {

    alert(
      "Please choose an image smaller than 10 MB."
    );

    event.target.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    const image =
      new Image();


    image.onload =
      function() {

        const maxWidth =
          900;

        const maxHeight =
          900;


        let width =
          image.width;

        let height =
          image.height;


        if (
          width >
          maxWidth
        ) {

          height =
            Math.round(
              height *
              (maxWidth /
                width)
            );

          width =
            maxWidth;

        }


        if (
          height >
          maxHeight
        ) {

          width =
            Math.round(
              width *
              (maxHeight /
                height)
            );

          height =
            maxHeight;

        }


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          width;

        canvas.height =
          height;


        const context =
          canvas.getContext(
            "2d"
          );


        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        reviewImageData =
          canvas.toDataURL(
            "image/jpeg",
            0.72
          );


        const preview =
          document.getElementById(
            "reviewImagePreview"
          );


        preview.innerHTML = `

          <div class="review-preview-wrapper">

            <img
              src="${reviewImageData}"
              alt="Review image preview"
            >


            <button
              type="button"
              class="remove-review-image"
              onclick="removeReviewImage()"
              title="Remove image"
            >

              <i class="fa-solid fa-xmark"></i>

            </button>

          </div>

        `;

      };


    image.src =
      e.target.result;

  };


  reader.readAsDataURL(
    file
  );

}


/* =========================================================
   REMOVE REVIEW IMAGE
   ========================================================= */

function removeReviewImage() {

  reviewImageData =
    null;


  const input =
    document.getElementById(
      "reviewImage"
    );


  const preview =
    document.getElementById(
      "reviewImagePreview"
    );


  if (input) {

    input.value = "";

  }


  if (preview) {

    preview.innerHTML =
      "";

  }

}


/* =========================================================
   SUBMIT REVIEW
   ========================================================= */

function submitReview() {

  const name =
    document
      .getElementById(
        "rev-name"
      )
      .value
      .trim();


  const text =
    document
      .getElementById(
        "rev-text"
      )
      .value
      .trim();


  const rating =
    document.querySelector(
      'input[name="stars"]:checked'
    )?.value;


  if (
    !name ||
    !rating
  ) {

    alert(
      "Please provide your name and a rating."
    );

    return;

  }


  if (
    !text &&
    !reviewImageData
  ) {

    alert(
      "Please write a review or add a photo."
    );

    return;

  }


  const reviewData = {

    productId:
      productId,

    name:
      name,

    comment:
      text,

    rating:
      Number(rating),

    ownerId:
      reviewerId,

    createdAt:
      firebase.firestore
        .FieldValue
        .serverTimestamp()

  };


  if (
    reviewImageData
  ) {

    reviewData.image =
      reviewImageData;

  }


  db.collection("reviews")
    .add(
      reviewData
    )

    .then(() => {

      alert(
        "Review posted successfully! ✨"
      );


      clearReviewForm();

    })

    .catch(err => {

      console.error(
        "Error posting review:",
        err
      );


      alert(
        "Unable to post review. Please try again."
      );

    });

}


/* =========================================================
   CLEAR REVIEW FORM
   ========================================================= */

function clearReviewForm() {

  document.getElementById(
    "rev-name"
  ).value = "";


  document.getElementById(
    "rev-text"
  ).value = "";


  document
    .querySelectorAll(
      'input[name="stars"]'
    )
    .forEach(
      el =>
        el.checked = false
    );


  removeReviewImage();

}


/* =========================================================
   REVIEW MENU
   ========================================================= */

function toggleReviewMenu(
  reviewId
) {

  const menu =
    document.getElementById(
      "review-menu-" + reviewId
    );


  if (!menu) {

    return;

  }


  document
    .querySelectorAll(
      ".review-menu"
    )
    .forEach(
      otherMenu => {

        if (
          otherMenu !== menu
        ) {

          otherMenu.classList.remove(
            "show"
          );

        }

      }
    );


  menu.classList.toggle(
    "show"
  );

}


/* =========================================================
   CLOSE MENUS
   ========================================================= */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".review-menu-container"
      )
    ) {

      document
        .querySelectorAll(
          ".review-menu"
        )
        .forEach(
          menu =>
            menu.classList.remove(
              "show"
            )
        );

    }

  }
);


/* =========================================================
   EDIT REVIEW
   ========================================================= */

function editReview(
  reviewId
) {

  document
    .querySelectorAll(
      ".review-menu"
    )
    .forEach(
      menu =>
        menu.classList.remove(
          "show"
        )
    );


  db.collection("reviews")
    .doc(reviewId)
    .get()

    .then(doc => {

      if (!doc.exists) {

        alert(
          "Review no longer exists."
        );

        return;

      }


      const review =
        doc.data();


      if (
        !review.ownerId
      ) {

        alert(
          "This is an older review and its owner cannot be verified."
        );

        return;

      }


      if (
        review.ownerId !==
        reviewerId
      ) {

        alert(
          "You can only edit your own review."
        );

        return;

      }


      editingReviewId =
        reviewId;


      document.getElementById(
        "rev-name"
      ).value =
        review.name ||
        "";


      document.getElementById(
        "rev-text"
      ).value =
        review.comment ||
        "";


      document
        .querySelectorAll(
          'input[name="stars"]'
        )
        .forEach(
          radio => {

            radio.checked =
              Number(
                radio.value
              ) ===
              Number(
                review.rating
              );

          }
        );


      reviewImageData =
        review.image ||
        null;


      const preview =
        document.getElementById(
          "reviewImagePreview"
        );


      if (
        review.image
      ) {

        preview.innerHTML = `

          <div class="review-preview-wrapper">

            <img
              src="${review.image}"
              alt="Current review image"
            >


            <button
              type="button"
              class="remove-review-image"
              onclick="removeReviewImage()"
            >

              <i class="fa-solid fa-xmark"></i>

            </button>

          </div>

        `;

      } else {

        preview.innerHTML =
          "";

      }


      const postButton =
        document.querySelector(
          ".review-form > .primary-btn"
        );


      postButton.innerHTML = `

        <i class="fa-solid fa-check"></i>

        Update Review

      `;


      postButton.onclick =
        updateReview;


      let cancelButton =
        document.getElementById(
          "cancelEditButton"
        );


      if (!cancelButton) {

        cancelButton =
          document.createElement(
            "button"
          );


        cancelButton.id =
          "cancelEditButton";


        cancelButton.type =
          "button";


        cancelButton.className =
          "cancel-edit-button";


        cancelButton.innerHTML = `

          <i class="fa-solid fa-xmark"></i>

          Cancel Edit

        `;


        cancelButton.onclick =
          cancelEditReview;


        postButton.parentNode.insertBefore(
          cancelButton,
          postButton
        );

      }


      document
        .querySelector(
          ".review-section"
        )
        .scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

    })

    .catch(err => {

      console.error(
        "Error loading review:",
        err
      );


      alert(
        "Unable to edit this review."
      );

    });

}


/* =========================================================
   UPDATE REVIEW
   ========================================================= */

function updateReview() {

  if (
    !editingReviewId
  ) {

    return;

  }


  const name =
    document
      .getElementById(
        "rev-name"
      )
      .value
      .trim();


  const text =
    document
      .getElementById(
        "rev-text"
      )
      .value
      .trim();


  const rating =
    document.querySelector(
      'input[name="stars"]:checked'
    )?.value;


  if (
    !name ||
    !rating
  ) {

    alert(
      "Please provide your name and a rating."
    );

    return;

  }


  if (
    !text &&
    !reviewImageData
  ) {

    alert(
      "Please write a review or add a photo."
    );

    return;

  }


  db.collection("reviews")
    .doc(editingReviewId)
    .get()

    .then(doc => {

      if (!doc.exists) {

        throw new Error(
          "Review not found."
        );

      }


      const review =
        doc.data();


      if (
        review.ownerId !==
        reviewerId
      ) {

        throw new Error(
          "You are not allowed to edit this review."
        );

      }


      const updateData = {

        name:
          name,

        comment:
          text,

        rating:
          Number(rating),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      };


      if (
        reviewImageData
      ) {

        updateData.image =
          reviewImageData;

      } else {

        updateData.image =
          firebase.firestore
            .FieldValue
            .delete();

      }


      return db.collection(
        "reviews"
      )
      .doc(editingReviewId)
      .update(
        updateData
      );

    })

    .then(() => {

      alert(
        "Review updated successfully! ✨"
      );


      cancelEditReview();

    })

    .catch(err => {

      console.error(
        "Error updating review:",
        err
      );


      alert(
        err.message ||
        "Unable to update review."
      );

    });

}


/* =========================================================
   CANCEL EDIT
   ========================================================= */

function cancelEditReview() {

  editingReviewId =
    null;


  clearReviewForm();


  const postButton =
    document.querySelector(
      ".review-form > .primary-btn"
    );


  if (postButton) {

    postButton.innerHTML =
      "Post Review";


    postButton.onclick =
      submitReview;

  }


  const cancelButton =
    document.getElementById(
      "cancelEditButton"
    );


  if (cancelButton) {

    cancelButton.remove();

  }

}


/* =========================================================
   DELETE REVIEW
   ========================================================= */

function deleteReview(
  reviewId
) {

  document
    .querySelectorAll(
      ".review-menu"
    )
    .forEach(
      menu =>
        menu.classList.remove(
          "show"
        )
    );


  db.collection("reviews")
    .doc(reviewId)
    .get()

    .then(doc => {

      if (!doc.exists) {

        alert(
          "Review no longer exists."
        );

        return;

      }


      const review =
        doc.data();


      if (
        !review.ownerId
      ) {

        alert(
          "This is an older review and its owner cannot be verified."
        );

        return;

      }


      if (
        review.ownerId !==
        reviewerId
      ) {

        alert(
          "You can only delete your own review."
        );

        return;

      }


      const confirmed =
        confirm(
          "Are you sure you want to delete this review?"
        );


      if (!confirmed) {

        return;

      }


      return db.collection(
        "reviews"
      )
      .doc(reviewId)
      .delete();

    })

    .then(() => {

      console.log(
        "Review delete operation completed."
      );

    })

    .catch(err => {

      console.error(
        "Error deleting review:",
        err
      );


      alert(
        err.message ||
        "Unable to delete review."
      );

    });

}


/* =========================================================
   LOAD REVIEWS
   ========================================================= */

function loadReviews() {

  db.collection("reviews")
    .where(
      "productId",
      "==",
      productId
    )

    .onSnapshot(

      snap => {

        const display =
          document.getElementById(
            "reviews-display"
          );


        display.innerHTML =
          "";


        if (
          snap.empty
        ) {

          display.innerHTML = `

            <p
              class="muted"
              style="text-align:center;"
            >

              No reviews yet.
              Be the first to share
              your thoughts!

            </p>

          `;

          return;

        }


        snap.forEach(
          doc => {

            const r =
              doc.data();


            const reviewId =
              doc.id;


            const stars =
              "★".repeat(
                r.rating
              ) +
              "☆".repeat(
                5 - r.rating
              );


            const menuHtml = `

              <div
                class="review-menu-container"
              >

                <button
                  type="button"
                  class="review-menu-button"
                  onclick="
                    event.stopPropagation();
                    toggleReviewMenu('${reviewId}')
                  "
                  aria-label="Review options"
                >

                  <i class="fa-solid fa-ellipsis-vertical"></i>

                </button>


                <div
                  class="review-menu"
                  id="review-menu-${reviewId}"
                >

                  <button
                    type="button"
                    onclick="
                      event.stopPropagation();
                      editReview('${reviewId}')
                    "
                  >

                    <i class="fa-solid fa-pen"></i>

                    Edit Review

                  </button>


                  <button
                    type="button"
                    class="delete-review-option"
                    onclick="
                      event.stopPropagation();
                      deleteReview('${reviewId}')
                    "
                  >

                    <i class="fa-solid fa-trash"></i>

                    Delete Review

                  </button>

                </div>

              </div>

            `;


            const commentHtml =
              r.comment
                ? `

                  <p class="review-comment">

                    ${escapeHtml(
                      r.comment
                    )}

                  </p>

                `
                : "";


            const imageHtml =
              r.image
                ? `

                  <div class="review-photo">

                    <img
                      src="${r.image}"
                      alt="Customer review photo"
                      onclick="openReviewImage('${r.image}')"
                    >

                  </div>

                `
                : "";


            display.innerHTML += `

              <div
                class="review-item"
              >

                <div class="review-top">

                  <strong>

                    ${escapeHtml(
                      r.name
                    )}

                  </strong>


                  <span class="stars-text">

                    ${stars}

                  </span>


                  ${menuHtml}

                </div>


                ${commentHtml}


                ${imageHtml}

              </div>

            `;

          }
        );

      },

      err => {

        console.error(
          "Firestore Error:",
          err
        );


        document.getElementById(
          "reviews-display"
        ).innerHTML = `

          <p class="muted">

            Failed to load reviews.

          </p>

        `;

      }

    );

}


/* =========================================================

   ========================================================= */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =========================================================
   OPEN REVIEW IMAGE
   ========================================================= */

function openReviewImage(
  image
) {

  const viewer =
    document.createElement(
      "div"
    );


  viewer.className =
    "review-image-viewer";


  viewer.innerHTML = `

    <div class="review-image-viewer-content">

      <button
        class="review-image-close"
        onclick="
          this.parentElement.parentElement.remove()
        "
      >

        <i class="fa-solid fa-xmark"></i>

      </button>


      <img
        src="${image}"
        alt="Customer review"
      >

    </div>

  `;


  viewer.addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        viewer
      ) {

        viewer.remove();

      }

    }
  );


  document.body.appendChild(
    viewer
  );

}


/* =========================================================
   PRODUCT IMAGE ZOOM
   Page zoom is disabled; only the main product image
   supports pinch / double-tap / mouse-wheel zoom.
   ========================================================= */

let productImageZoom = 1;
let productImageOffsetX = 0;
let productImageOffsetY = 0;

let productImagePinchStartDistance = 0;
let productImagePinchStartZoom = 1;

let productImagePanStartX = 0;
let productImagePanStartY = 0;
let productImagePanStartOffsetX = 0;
let productImagePanStartOffsetY = 0;

let productImageDragging = false;
let productImageLastTap = 0;

function initProductImageZoom() {

  const image =
    document.getElementById("mainImg");

  if (!image) {
    return;
  }

  image.style.touchAction = "none";
  image.style.userSelect = "none";
  image.style.webkitUserSelect = "none";
  image.style.webkitUserDrag = "none";
  image.style.webkitTouchCallout = "none";
  image.draggable = false;

  image.addEventListener(
    "touchstart",
    handleProductImageTouchStart,
    { passive: false }
  );

  image.addEventListener(
    "touchmove",
    handleProductImageTouchMove,
    { passive: false }
  );

  image.addEventListener(
    "touchend",
    handleProductImageTouchEnd,
    { passive: false }
  );

  image.addEventListener(
    "wheel",
    handleProductImageWheel,
    { passive: false }
  );

  image.addEventListener(
    "dblclick",
    handleProductImageDoubleClick
  );

  image.addEventListener(
    "mousedown",
    handleProductImageMouseDown
  );

  image.addEventListener(
    "load",
    resetProductImageZoom
  );

  applyProductImageTransform();
}


function handleProductImageTouchStart(event) {

  event.preventDefault();

  if (event.touches.length === 2) {

    productImagePinchStartDistance =
      getProductImageTouchDistance(
        event.touches[0],
        event.touches[1]
      );

    productImagePinchStartZoom =
      productImageZoom;

    return;
  }

  if (event.touches.length === 1) {

    const now = Date.now();

    if (now - productImageLastTap < 300) {

      if (productImageZoom > 1) {

        resetProductImageZoom();

      } else {

        productImageZoom = 2;
        productImageOffsetX = 0;
        productImageOffsetY = 0;

        applyProductImageTransform();
      }

      productImageLastTap = 0;
      return;
    }

    productImageLastTap = now;

    productImagePanStartX =
      event.touches[0].clientX;

    productImagePanStartY =
      event.touches[0].clientY;

    productImagePanStartOffsetX =
      productImageOffsetX;

    productImagePanStartOffsetY =
      productImageOffsetY;
  }
}


function handleProductImageTouchMove(event) {

  event.preventDefault();

  if (event.touches.length === 2) {

    const currentDistance =
      getProductImageTouchDistance(
        event.touches[0],
        event.touches[1]
      );

    if (productImagePinchStartDistance > 0) {

      productImageZoom =
        Math.min(
          4,
          Math.max(
            1,
            productImagePinchStartZoom *
              (currentDistance / productImagePinchStartDistance)
          )
        );

      if (productImageZoom === 1) {

        productImageOffsetX = 0;
        productImageOffsetY = 0;
      }

      applyProductImageTransform();
    }

    return;
  }

  if (
    event.touches.length === 1 &&
    productImageZoom > 1
  ) {

    productImageOffsetX =
      productImagePanStartOffsetX +
      (
        event.touches[0].clientX -
        productImagePanStartX
      );

    productImageOffsetY =
      productImagePanStartOffsetY +
      (
        event.touches[0].clientY -
        productImagePanStartY
      );

    applyProductImageTransform();
  }
}


function handleProductImageTouchEnd(event) {

  event.preventDefault();

  if (event.touches.length < 2) {
    productImagePinchStartDistance = 0;
  }

  if (
    productImageZoom <= 1.01
  ) {

    productImageZoom = 1;
    productImageOffsetX = 0;
    productImageOffsetY = 0;

    applyProductImageTransform();
  }
}


function getProductImageTouchDistance(touch1, touch2) {

  const dx =
    touch1.clientX -
    touch2.clientX;

  const dy =
    touch1.clientY -
    touch2.clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );
}


function handleProductImageWheel(event) {

  event.preventDefault();

  const zoomStep =
    event.deltaY < 0 ? 0.2 : -0.2;

  productImageZoom =
    Math.min(
      4,
      Math.max(
        1,
        productImageZoom + zoomStep
      )
    );

  if (productImageZoom === 1) {

    productImageOffsetX = 0;
    productImageOffsetY = 0;
  }

  applyProductImageTransform();
}


function handleProductImageDoubleClick(event) {

  event.preventDefault();

  if (productImageZoom > 1) {

    resetProductImageZoom();

  } else {

    productImageZoom = 2;
    productImageOffsetX = 0;
    productImageOffsetY = 0;

    applyProductImageTransform();
  }
}


function handleProductImageMouseDown(event) {

  if (productImageZoom <= 1) {
    return;
  }

  event.preventDefault();

  productImageDragging = true;

  productImagePanStartX =
    event.clientX;

  productImagePanStartY =
    event.clientY;

  productImagePanStartOffsetX =
    productImageOffsetX;

  productImagePanStartOffsetY =
    productImageOffsetY;

  document.addEventListener(
    "mousemove",
    handleProductImageMouseMove
  );

  document.addEventListener(
    "mouseup",
    handleProductImageMouseUp
  );
}


function handleProductImageMouseMove(event) {

  if (!productImageDragging) {
    return;
  }

  productImageOffsetX =
    productImagePanStartOffsetX +
    (
      event.clientX -
      productImagePanStartX
    );

  productImageOffsetY =
    productImagePanStartOffsetY +
    (
      event.clientY -
      productImagePanStartY
    );

  applyProductImageTransform();
}


function handleProductImageMouseUp() {

  productImageDragging = false;

  document.removeEventListener(
    "mousemove",
    handleProductImageMouseMove
  );

  document.removeEventListener(
    "mouseup",
    handleProductImageMouseUp
  );
}


function applyProductImageTransform() {

  const image =
    document.getElementById("mainImg");

  if (!image) {
    return;
  }

  image.style.transform =
    `translate3d(
      ${productImageOffsetX}px,
      ${productImageOffsetY}px,
      0
    ) scale(${productImageZoom})`;
}


function resetProductImageZoom() {

  productImageZoom = 1;
  productImageOffsetX = 0;
  productImageOffsetY = 0;
  productImagePinchStartDistance = 0;

  applyProductImageTransform();
}

  border-radius:
    12px;

  padding:
    6px;

  box-shadow:
    0 10px 30px
    rgba(45, 39, 30, 0.18);

  display:
    none;

  z-index:
    999;

}


.review-menu.show {

  display:
    block;

}


.review-menu button {

  width:
    100%;

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  padding:
    11px 12px;

  border:
    none;

  background:
    transparent;

  color:
    var(--text);

  border-radius:
    8px;

  cursor:
    pointer;

  text-align:
    left;

  font-family:
    inherit;

  font-size:
    14px;

}


.review-menu button:hover {

  background:
    rgba(89, 173, 147, 0.10);

  color:
    var(--primary);

}


.review-menu .delete-review-option {

  color:
    #D9534F;

}


/* =========================================================
   REVIEW CONTENT
   ========================================================= */

.stars-text {

  color:
    var(--primary);

  font-size:
    14px;

  letter-spacing:
    2px;

}


.review-comment {

  color:
    var(--text);

  line-height:
    1.6;

  margin:
    5px 0 15px;

  white-space:
    pre-wrap;

  word-break:
    break-word;

}


.review-photo {

  margin-top:
    12px;

}


.review-photo img {

  display:
    block;

  width:
    100%;

  max-width:
    320px;

  max-height:
    320px;

  object-fit:
    cover;

  border-radius:
    14px;

  cursor:
    zoom-in;

  border:
    1px solid var(--border);

}


/* =========================================================
   REVIEW IMAGE VIEWER
   ========================================================= */

.review-image-viewer {

  position:
    fixed;

  inset:
    0;

  background:
    rgba(0, 0, 0, 0.82);

  z-index:
    9999;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    30px;

}


.review-image-viewer-content {

  position:
    relative;

  max-width:
    900px;

  max-height:
    90vh;

}


.review-image-viewer-content img {

  display:
    block;

  max-width:
    100%;

  max-height:
    85vh;

  object-fit:
    contain;

  border-radius:
    14px;

}


.review-image-close {

  position:
    absolute;

  top:
    -45px;

  right:
    0;

  width:
    38px;

  height:
    38px;

  border:
    none;

  border-radius:
    50%;

  background:
    #FFFFFF;

  color:
    #333;

  cursor:
    pointer;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

  .product-back-button {

    top:
      18px;

    left:
      18px;

    width:
      50px;

    height:
      50px;

  }


  .product-layout {

    grid-template-columns:
      1fr;

    gap:
      25px;

  }


  .image-section {

    flex-direction:
      column-reverse;

  }


  .thumbs {

    flex-direction:
      row;

    width:
      100%;

    overflow-x:
      auto;

    padding-bottom:
      10px;

  }


  .thumbs img {

    width:
      70px;

    height:
      70px;

  }


  .details h2 {

    font-size:
      24px;

  }


  .details .price {

    font-size:
      28px;

  }


  .size-options {

    gap:
      8px;

  }


  .size-option {

    width:
      44px;

    height:
      44px;

    font-size:
      11px;

  }


  .size-header {

    align-items:
      flex-start;

    flex-direction:
      column;

    gap:
      4px;

  }


  .review-photo img {

    max-width:
      100%;

    max-height:
      280px;

  }


  .review-menu {

    width:
      160px;

  }

}


/* =========================================================
   PAGE ZOOM CONTROL + PRODUCT IMAGE ZOOM
   ========================================================= */

html,
body {
  touch-action: pan-x pan-y;
  overscroll-behavior-x: none;
}

.main-img {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
  transform-origin: center center;
  cursor: zoom-in;
  will-change: transform;
}

.main-img:active {
  cursor: grabbing;
}

</style>


</body>

</html>
